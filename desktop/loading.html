<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';" />
    <title>API for Cursor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06131a;
        --ink: #e4f1f6;
        --muted: #8aadb8;
        --signal: #5ce1ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .card {
        width: min(420px, 100%);
        text-align: center;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        border-radius: 12px;
        border: 1px solid rgba(92, 225, 255, 0.28);
        box-shadow: 0 0 24px rgba(92, 225, 255, 0.18);
        background: radial-gradient(circle at 30% 20%, rgba(92, 225, 255, 0.35), transparent 55%), #0e2430;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .bar {
        margin: 28px auto 0;
        width: 180px;
        height: 3px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(92, 225, 255, 0.12);
      }
      .bar > span {
        display: block;
        height: 100%;
        width: 40%;
        background: var(--signal);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(340%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="mark" aria-hidden="true"></div>
        <h1>API for Cursor</h1>
        <p id="status">正在启动本机中转服务…</p>
        <div class="bar"><span></span></div>
      </div>
    </main>
  </body>
</html>
